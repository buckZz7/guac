# guac gateway — Fly.io config
app = "guac"

[build]
  dockerfile = "Dockerfile"

# Run on the smallest cheap VM. Per-second billing; idle ≈ $0.
[primary]
  region = "iad"

[mounts]
  source = "guac_data"
  destination = "/data"

[env]
  # NOTE: ADGATE_GATEWAY_KEY is NOT set here on purpose. It's a secret and
  # must be set via `fly secrets set` (or the dashboard Secrets tab) — secrets
  # override env, and env here is committed to a public repo. Leaving it unset
  # means the gateway falls back to "dev-gateway-key", which is only safe for
  # a local/dev instance. Set a real key before going live.
  ADGATE_ADS_PER_DAY = "1"
  ADGATE_DISCOUNT_RATE = "0.20"
  # Public host for sign-up so the returned base_url is correct (no 127.0.0.1).
  # Change to your app's URL: https://<app>.fly.dev
  ADGATE_PUBLIC_HOST = "https://guac.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
